name: Commit defense

on:
  schedule:
    - cron: "15 0 * * *" # daily; rotates the battle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the renderer (okturan/github-blocks)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: okturan/github-blocks
          ref: 746ac311d4ce9887f9f4b4a8d4965fc6a8b4c038

      - name: Simulate today's battle
        env:
          BLOCK: "lane-defense"
          PROFILE_USER: "NefiseBikbay"
          LD_LEVEL: "rotate" # 1 | 2 | 3 | rotate
          LD_SEED: "daily" # daily = new battle every run
          LD_TITLE: "COMMIT DEFENSE"
        run: node action/generate.mjs

      - name: Publish to output branch
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update lane-defense battle"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
